<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Runner Ciberseguro</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b5e2a;
    color: white;
    text-align: center;
  }

  h2 {
    margin: 10px;
  }

  canvas {
    background: #e8f5e9;
    display: block;
    margin: 0 auto;
    border: 4px solid #f9a825;
    border-radius: 10px;
  }

  #ui {
    margin: 10px;
    font-size: 18px;
  }

  button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: #f9a825;
    color: black;
    cursor: pointer;
    font-weight: bold;
  }

  #startScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(#0b5e2a, #1976d2);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
  }

  #questionBox {
    background: white;
    color: black;
    padding: 20px;
    border-radius: 15px;
    max-width: 320px;
  }
</style>
</head>

<body>

<h2>🎮 Runner Ciberseguro</h2>

<canvas id="game" width="400" height="500"></canvas>

<div id="ui">
  Puntaje: <span id="score">0</span> |
  Nivel: <span id="nivel">Fácil</span>
</div>

<!-- INICIO -->
<div id="startScreen">
  <h2>🏆 Gobernación de Risaralda</h2>

  <p style="max-width:300px;">
    <img src="img/logo-risaralda.png" style="width:200px;"><br><br>
    Usa ← →, Barra espaciadora o click para moverte<br><br>
    Evita peligros 🚧<br><br>
    <br>Coge los regalos 🎁 y estrellas ⭐ para sumar puntos <br><br>
    Responde preguntas ❓<br><br>
    ¡Llega al final! 🎉
  </p>

  <button onclick="startGame()">Iniciar Juego</button>
</div>

<!-- PREGUNTAS -->
<div id="overlay">
  <div id="questionBox">
    <h3 id="question"></h3>
    <div id="answers"></div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = { x: 180, y: 420, w: 40, h: 60 };
let obstacles = [];
let score = 0;
let speed = 2;
let gameRunning = false;

/* 🔊 SONIDO */
function sound(freq) {
  let ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  let osc = ctxAudio.createOscillator();
  osc.connect(ctxAudio.destination);
  osc.frequency.value = freq;
  osc.start();
  setTimeout(() => osc.stop(), 120);
}

/* 🧠 PREGUNTAS */
const niveles = {
  facil: [
    { q: "¿Qué es el ciberacoso?", a: ["Molestar por internet", "Jugar online"], c: 0 },
    { q: "¿Debes compartir tu contraseña?", a: ["Sí", "No"], c: 1 }
  ],
  medio: [
    { q: "Te piden fotos personales", a: ["Enviar", "No enviar"], c: 1 },
    { q: "Perfil sospechoso", a: ["Confiar", "Verificar"], c: 1 }
  ],
  dificil: [
    { q: "Te amenazan", a: ["Ignorar", "Denunciar"], c: 1 },
    { q: "Te chantajean", a: ["Aceptar", "Buscar ayuda"], c: 1 }
  ]
};

let nivel = "facil";
let pool = [];

/* CONTROLES */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") player.x -= 20;
  if (e.key === "ArrowRight") player.x += 20;

  if (player.x < 0) player.x = 0;
  if (player.x > 360) player.x = 360;
});

/* 👦 DIBUJAR NIÑO */
function drawPlayer() {
  let x = player.x, y = player.y;

  // cabeza
  ctx.fillStyle = "#fcd5b4";
  ctx.beginPath();
  ctx.arc(x + 20, y + 10, 10, 0, Math.PI * 2);
  ctx.fill();

  // cuerpo
  ctx.fillStyle = "#1976d2";
  ctx.fillRect(x + 10, y + 20, 20, 25);

  // piernas
  ctx.fillStyle = "#333";
  ctx.fillRect(x + 10, y + 45, 8, 15);
  ctx.fillRect(x + 22, y + 45, 8, 15);
}

/* DIBUJAR */
function draw() {
  ctx.clearRect(0, 0, 400, 500);

  drawPlayer();

  obstacles.forEach(o => {
    ctx.font = "28px Arial";
    ctx.fillText(o.emoji, o.x, o.y);
  });
}

/* UPDATE */
function update() {
  if (!gameRunning) return;

  // niveles
  if (score > 200) {
    nivel = "dificil";
    speed = 4;
  } else if (score > 100) {
    nivel = "medio";
    speed = 3;
  } else {
    nivel = "facil";
    speed = 2;
  }

  document.getElementById("nivel").innerText = nivel;

  // generar obstáculos
  if (Math.random() < 0.03) {
    let tipos = [
      { emoji: "🗑️", tipo: "malo" },
      { emoji: "🚗", tipo: "malo" },
      { emoji: "👤", tipo: "malo" },
      { emoji: "⭐", tipo: "bueno" },
      { emoji: "🎁", tipo: "bueno" }
    ];

    let t = tipos[Math.floor(Math.random() * tipos.length)];

    obstacles.push({
      x: Math.random() * 360,
      y: 0,
      emoji: t.emoji,
      tipo: t.tipo
    });
  }

  obstacles.forEach(o => o.y += speed);

  // colisiones
  obstacles.forEach(o => {
    if (
      player.x < o.x + 40 &&
      player.x + 40 > o.x &&
      player.y < o.y + 40 &&
      player.y + 40 > o.y
    ) {
      if (o.tipo === "malo") {
        sound(200);
        gameRunning = false;
        showQuestion();
      } else {
        sound(900);
        score += 30;
      }

      obstacles = obstacles.filter(ob => ob !== o);
    }
  });

  score++;
  document.getElementById("score").innerText = score;
}

/* LOOP */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

/* START */
function startGame() {
  document.getElementById("startScreen").style.display = "none";
  gameRunning = true;
  pool = [...niveles[nivel]];
}

/* PREGUNTA */
function showQuestion() {
  if (pool.length === 0) {
    pool = [...niveles[nivel]];
  }

  let i = Math.floor(Math.random() * pool.length);
  let q = pool.splice(i, 1)[0];

  document.getElementById("overlay").style.display = "flex";
  document.getElementById("question").innerText = q.q;

  let html = "";
  q.a.forEach((ans, index) => {
    html += `<button onclick="answer(${index}, ${q.c})">${ans}</button>`;
  });

  document.getElementById("answers").innerHTML = html;
}

/* RESPUESTA */
function answer(i, c) {
  if (i === c) {
    sound(800);
    score += 50;
  } else {
    sound(100);
    endGame(false);
    return;
  }

  document.getElementById("overlay").style.display = "none";
  gameRunning = true;
}

/* FINAL */
function endGame() {
  gameRunning = false;
  document.getElementById("overlay").style.display = "flex";
  document.getElementById("question").innerHTML = "❌ Intenta otra vez";
  document.getElementById("answers").innerHTML =
    "<button onclick='location.reload()'>Reiniciar</button>";
}
</script>

</body>
</html>
