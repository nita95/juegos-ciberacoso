<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Runner Ciberseguro</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b5e2a; /* verde institucional */
  color:white;
  text-align:center;
}

h2 {
  margin:10px;
}

canvas {
  background:#e8f5e9;
  display:block;
  margin:0 auto;
  border:4px solid #f9a825; /* amarillo */
  border-radius:10px;
}

#ui {
  margin:10px;
  font-size:18px;
}

/* BOTONES */
button {
  padding:10px 15px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#f9a825;
  color:black;
  cursor:pointer;
  font-weight:bold;
}

/* PANTALLA INICIAL */
#startScreen {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:linear-gradient(#0b5e2a, #1976d2);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

/* PREGUNTAS */
#overlay {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
</style>

</head>

<body>

<h2>🎮 Runner Ciberseguro</h2>

<canvas id="game" width="400" height="500"></canvas>

<div id="ui">
  Puntaje: <span id="score">0</span>
</div>

<!-- PANTALLA INICIAL -->
<div id="startScreen">

<h2>🏆 Gobernación de Risaralda</h2>

<p style="max-width:300px;">
  <img src="img/logo-risaralda.png" alt="Logo Risaralda" style="width: 200px;"><br><br>
Usa ← → para moverte<br><br>
Evita peligros 🚧<br><br>
Responde bien las preguntas ❓<br><br>
¡Llega al final para ganar! 🎉
</p>

<button onclick="startGame()">Iniciar Juego</button>

</div>

<!-- PREGUNTAS -->
<div id="overlay">
  <h3 id="question"></h3>
  <div id="answers"></div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {x:180, y:420, w:40, h:40};
let obstacles = [];
let score = 0;
let speed = 2;
let gameRunning = false;

/* 🔄 NUEVAS PREGUNTAS (más claras para niños) */
let questions = [

{ q:"¿Qué haces si alguien te insulta en internet? 😢", a:["Responder igual","Ignorar y pedir ayuda"], c:1 },
{ q:"¿Debes compartir tu contraseña con alguien?", a:["Sí","No"], c:1 },
{ q:"¿Qué haces si te piden una foto personal?", a:["La envío","No la envío"], c:1 },
{ q:"Si un mensaje te da mala espina, tú...", a:["Respondes","Lo bloqueas"], c:1 },
{ q:"Si un grupo te hace sentir mal...", a:["Te quedas","Te sales"], c:1 },
{ q:"Si alguien te amenaza en internet...", a:["Te quedas callado","Buscas ayuda"], c:1 },
{ q:"¿Debes enviar tu ubicación a desconocidos?", a:["Sí","No"], c:1 },
{ q:"Si alguien te molesta mucho...", a:["Respondes","Lo bloqueas"], c:1 },
{ q:"Si ves un perfil raro...", a:["Confías","Verificas"], c:1 },
{ q:"Si alguien te pide algo a cambio (chantaje)...", a:["Aceptas","Pides ayuda"], c:1 }

];

// MEZCLAR
questions.sort(() => Math.random() - 0.5);

let qIndex = 0;

// CONTROLES
document.addEventListener("keydown", e=>{
if(e.key==="ArrowLeft"){
player.x -= 20;
}
if(e.key==="ArrowRight"){
player.x += 20;
}

// límites
if(player.x < 0) player.x = 0;
if(player.x > canvas.width - player.w)
player.x = canvas.width - player.w;

});

// DIBUJAR
function draw(){
ctx.clearRect(0,0,400,500);

// jugador
ctx.fillStyle="#1b5e20";
ctx.fillRect(player.x, player.y, player.w, player.h);

/* 🎨 NUEVOS ÍCONOS DE OBSTÁCULOS */
obstacles.forEach(o=>{
ctx.font="30px Arial";
ctx.fillText(o.icon, o.x, o.y);
});
}

// ACTUALIZAR
function update(){
if(!gameRunning) return;

if(Math.random()<0.03){

/* 🚧 ÍCONOS MÁS VISUALES */
let icons = ["🚗","🗑️","⚠️","👤","🚫"];
let randomIcon = icons[Math.floor(Math.random()*icons.length)];

obstacles.push({
x:Math.random()*360,
y:0,
icon:randomIcon
});
}

obstacles.forEach(o=>o.y+=speed);

obstacles.forEach(o=>{
if(player.x < o.x+40 &&
player.x+40 > o.x &&
player.y < o.y+40 &&
player.y+40 > o.y){
gameRunning=false;
showQuestion();
}
});

score++;
document.getElementById("score").innerText=score;
}

// LOOP
function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();

// INICIAR
function startGame(){
document.getElementById("startScreen").style.display="none";
gameRunning = true;
}

// PREGUNTAS
function showQuestion(){
if(qIndex>=questions.length){
endGame(true);
return;
}

let q=questions[qIndex];
document.getElementById("overlay").style.display="flex";
document.getElementById("question").innerText=q.q;

let html="";
q.a.forEach((ans,i)=>{
html+=`<button onclick="answer(${i})">${ans}</button>`;
});
document.getElementById("answers").innerHTML=html;
}

function answer(i){
let q=questions[qIndex];

if(i===q.c){
qIndex++;
document.getElementById("overlay").style.display="none";
gameRunning=true;
obstacles=[];
}else{
endGame(false);
}
}

// FINAL
function endGame(win){
let overlay=document.getElementById("overlay");
overlay.style.display="flex";

if(win){
saveScore(score);
document.getElementById("question").innerHTML="🎉 ¡Ganaste!";
}else{
document.getElementById("question").innerHTML="❌ Intenta otra vez";
}

document.getElementById("answers").innerHTML=
"<button onclick='location.reload()'>Reiniciar</button>"+
"<button onclick='showRanking()'>Ranking</button>";
}

// RANKING
function saveScore(s){
let scores=JSON.parse(localStorage.getItem("ranking"))||[];
scores.push(s);
scores.sort((a,b)=>b-a);
scores=scores.slice(0,5);
localStorage.setItem("ranking",JSON.stringify(scores));
}

function showRanking(){
let scores=JSON.parse(localStorage.getItem("ranking"))||[];
let list="<h3>🏆 Ranking</h3>";
scores.forEach((s,i)=>{
list+=`<p>${i+1}. ${s}</p>`;
});
document.getElementById("question").innerHTML=list;
document.getElementById("answers").innerHTML=
"<button onclick='location.reload()'>Jugar otra vez</button>";
}

</script>

</body>
</html>
